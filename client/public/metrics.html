<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Metric — Sweet Momentum</title>
  <meta id="meta-description" name="description" content="Learn about this Sweet Momentum core metric — what it means, why it matters, and how it ties into the book." />
  <meta id="meta-og-title" property="og:title" content="Core Metric — Sweet Momentum" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111111; --border: rgba(255,255,255,0.08);
      --text: #ffffff; --muted: rgba(255,255,255,0.55);
      --accent: #FF6E00; --green: #85FF00;
      --metric: #85FF00; /* overridden per metric via JS */
      --font-body: 'Cabinet Grotesk', system-ui, sans-serif;
      --font-disp: 'Clash Display', 'Cabinet Grotesk', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.7; opacity: 0; transition: opacity 0.3s ease; }
    body.ready { opacity: 1; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 24px; }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; background: rgba(10,10,10,0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
    .nav-logo img { width: 28px; height: 28px; border-radius: 7px; }
    .nav-logo span { font-family: var(--font-disp); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
    .nav-link { color: var(--muted); text-decoration: none; font-size: 14px; }
    .nav-link:hover { color: var(--text); }

    /* Metric switcher strip */
    .metric-strip {
      display: flex; gap: 8px; padding: 14px 24px; overflow-x: auto;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .metric-strip a {
      flex-shrink: 0; font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
      color: var(--muted); text-decoration: none; padding: 6px 14px; border-radius: 100px;
      border: 1px solid var(--border); transition: all 0.15s;
    }
    .metric-strip a:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
    .metric-strip a.active { color: #0a0a0a; background: var(--metric); border-color: var(--metric); }

    header.hero { padding: 56px 0 40px; text-align: center; position: relative; }
    header.hero::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 500px; height: 320px;
      background: radial-gradient(circle, color-mix(in srgb, var(--metric) 14%, transparent) 0%, transparent 70%);
      pointer-events: none;
    }
    .metric-icon-wrap {
      width: 88px; height: 88px; border-radius: 24px; margin: 0 auto 22px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--metric) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--metric) 30%, transparent);
      position: relative; z-index: 1; overflow: hidden;
    }
    .metric-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .metric-icon-wrap .fallback { font-size: 40px; }
    .tag {
      display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      color: #0a0a0a; background: var(--metric);
      border-radius: 100px; padding: 5px 16px; margin-bottom: 20px; position: relative; z-index: 1;
    }
    h1 {
      font-family: var(--font-disp); font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 700;
      letter-spacing: -0.03em; margin-bottom: 14px; position: relative; z-index: 1;
    }
    header.hero .sub { color: var(--muted); font-size: 17px; max-width: 520px; margin: 0 auto; position: relative; z-index: 1; }

    main { padding: 24px 0 80px; }
    .hero-image { width: 100%; height: 300px; border-radius: 18px; overflow: hidden; margin-bottom: 40px; }
    .hero-image img { width: 100%; height: 100%; object-fit: cover; }

    .story-body p { font-size: 17px; color: rgba(255,255,255,0.82); line-height: 1.9; margin-bottom: 20px; }

    .pull-quote {
      margin: 40px 0; padding: 26px 28px;
      background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--metric); border-radius: 0 14px 14px 0;
      font-size: 18px; font-style: italic; color: rgba(255,255,255,0.9); line-height: 1.7;
    }
    .pull-quote .attribution { display: block; margin-top: 12px; font-style: normal; font-size: 13px; font-weight: 800; color: var(--metric); }

    .cta-block { margin-top: 56px; padding: 32px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); text-align: center; }
    .cta-block h2 { font-family: var(--font-disp); font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
    .cta-block p { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px;
      text-decoration: none; border-radius: 10px; padding: 12px 26px; transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #e55e00; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: rgba(255,255,255,0.3); }

    .not-found { text-align: center; padding: 100px 24px; }
    .not-found h1 { font-size: 1.8rem; }

    footer { padding: 32px 0; border-top: 1px solid var(--border); text-align: center; font-size: 13px; color: rgba(255,255,255,0.3); }
    footer a { color: rgba(255,255,255,0.5); text-decoration: none; margin: 0 10px; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

  <nav>
    <a href="/start" class="nav-logo">
      <img src="/favicon.png" alt="Sweet Momentum" />
      <span>SWEET MOMENTUM</span>
    </a>
    <a href="/start" class="nav-link">Home</a>
  </nav>

  <div class="metric-strip" id="metric-strip"></div>

  <div id="app"></div>

  <footer>
    <div>
      <a href="/start">Home</a>
      <a href="/book">The Book</a>
      <a href="/stuck">Founder's Story</a>
    </div>
    <p style="margin-top:14px;">© <span id="year"></span> Sweet Momentum · Louisville, KY</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const METRICS = {
      TIME: { color: '#a78bfa', emoji: '🍭', name: 'TIME' },
      GOAL: { color: '#fbbf24', emoji: '🍬', name: 'GOAL' },
      TEAM: { color: '#22d3ee', emoji: '🍫', name: 'TEAM' },
      TASK: { color: '#34d399', emoji: '🧁', name: 'TASK' },
      VIEW: { color: '#fb7185', emoji: '🍩', name: 'VIEW' },
      PACE: { color: '#60a5fa', emoji: '🍡', name: 'PACE' },
    };

    const DEFAULT_CONTENT = {
      TIME: {
        story: "Time is the one resource you can never reclaim. How you spend each hour is a vote for the life you want to live. Intentional time management means choosing what matters most and protecting it fiercely.\\n\\nIn Sweet Momentum, TIME asks a simple daily question: did you own your hours today, or did they own you? It's not about doing more — it's about doing what matters, on purpose, before the day does it for you.",
        quote: "The key is not to prioritize what's on your schedule, but to schedule your priorities.",
        quoteAuthor: "Stephen Covey",
      },
      GOAL: {
        story: "A goal without a plan is just a wish. Each day you pursue your primary goal with focus, you build the momentum that transforms vision into reality. Small consistent steps compound into extraordinary outcomes.\\n\\nGOAL is the metric that keeps your biggest ambition in view, one day at a time — not a New Year's resolution you forget by February, but a daily check-in with the thing you actually want.",
        quote: "A goal is not always meant to be reached; it often serves simply as something to aim at.",
        quoteAuthor: "Bruce Lee",
      },
      TEAM: {
        story: "No one achieves greatness alone. Your contribution to the people around you — teammates, colleagues, family — shapes the collective energy you all move through. Show up for others and they show up for you.\\n\\nTEAM tracks whether you added something to someone else's day. Momentum isn't just personal; it's contagious, and the people around you are either catching yours or starving for it.",
        quote: "Alone we can do so little; together we can do so much.",
        quoteAuthor: "Helen Keller",
      },
      TASK: {
        story: "The most important task of the day rarely feels the most urgent. Choosing to tackle your highest-leverage work before the day dilutes your attention is the discipline that separates consistent performers from the rest.\\n\\nTASK isn't about your to-do list length — it's about whether you did the one thing that actually moved the needle, even when ten easier things were begging for your attention first.",
        quote: "Do the hard jobs first. The easy jobs will take care of themselves.",
        quoteAuthor: "Dale Carnegie",
      },
      VIEW: {
        story: "Perspective is the lens through which every event passes. Keeping a clear view means stepping back from the noise to see the bigger picture — your purpose, your trajectory, and what truly matters long-term.\\n\\nVIEW is a daily gut-check: did you let a bad moment define your whole day, or did you hold onto the wider view of where you're headed? It's the metric of mental posture.",
        quote: "We can complain because rose bushes have thorns, or rejoice because thorns have roses.",
        quoteAuthor: "Alphonse Karr",
      },
      PACE: {
        story: "Sustainable performance comes from finding the right rhythm — not sprinting until burnout, not coasting below potential. Pace is the art of knowing when to push, when to recover, and how to maintain momentum over the long run.\\n\\nPACE is the metric this whole book grew out of — the daily practice of showing up consistently, in a rhythm you can actually sustain, rather than a burst you'll regret by Thursday.",
        quote: "It does not matter how slowly you go as long as you do not stop.",
        quoteAuthor: "Confucius",
      },
    };

    const key = (window.location.pathname.split('/').pop() || '').toUpperCase();
    const app = document.getElementById('app');
    const strip = document.getElementById('metric-strip');

    // Build the metric switcher strip
    strip.innerHTML = Object.keys(METRICS).map(k =>
      `<a href="/metrics/${k.toLowerCase()}" class="${k === key ? 'active' : ''}">${k}</a>`
    ).join('');

    if (!METRICS[key]) {
      app.innerHTML = `
        <div class="not-found container">
          <h1>Metric Not Found</h1>
          <p style="color:var(--muted);margin-top:12px;">That's not one of the six core metrics. Try TIME, GOAL, TEAM, TASK, VIEW, or PACE above.</p>
        </div>`;
      document.body.classList.add('ready');
    } else {
      const meta = METRICS[key];
      document.documentElement.style.setProperty('--metric', meta.color);
      document.title = `${meta.name} — Core Metric — Sweet Momentum`;
      document.getElementById('meta-description').setAttribute('content', `Learn about ${meta.name}, one of the six core metrics in Sweet Momentum — what it means, why it matters, and how it ties into the book.`);
      document.getElementById('meta-og-title').setAttribute('content', `${meta.name} — Sweet Momentum`);

      fetch('/api/public/metric-content')
        .then(r => r.ok ? r.json() : [])
        .catch(() => [])
        .then(list => {
          const content = (Array.isArray(list) ? list.find(c => c.metricKey === key) : null) || {};
          const defaults = DEFAULT_CONTENT[key];
          const story = content.story || defaults.story;
          const quote = content.quote || defaults.quote;
          const quoteAuthor = content.quoteAuthor || defaults.quoteAuthor;
          const heroImage = content.imageUrl || null;
          const candyIcon = content.candyIconUrl || null;

          const storyParagraphs = story.split(/\\n\\n+/).map(p => `<p>${p}</p>`).join('');

          app.innerHTML = `
            <header class="hero container">
              <div class="metric-icon-wrap">
                ${candyIcon ? `<img src="${candyIcon}" alt="${meta.name} icon" />` : `<span class="fallback">${meta.emoji}</span>`}
              </div>
              <div class="tag">Core Metric</div>
              <h1>${meta.name}</h1>
              <p class="sub">One of the six daily metrics at the heart of Sweet Momentum \u2014 and the book that started it all.</p>
            </header>
            <main class="container">
              ${heroImage ? `<div class="hero-image"><img src="${heroImage}" alt="${meta.name}" /></div>` : ''}
              <div class="story-body">${storyParagraphs}</div>
              ${quote ? `
                <div class="pull-quote">
                  "${quote}"
                  ${quoteAuthor ? `<span class="attribution">\u2014 ${quoteAuthor}</span>` : ''}
                </div>` : ''}
              <div class="cta-block">
                <h2>Start Tracking ${meta.name} Today</h2>
                <p>Score your ${meta.name.toLowerCase()} every day, alongside the other five core metrics, free.</p>
                <div class="cta-row">
                  <a href="/#/register" class="btn btn-primary">Get the App Free</a>
                  <a href="/book" class="btn btn-outline">Read the Book</a>
                </div>
              </div>
            </main>
          `;
          document.body.classList.add('ready');
        });
    }
  </script>

</body>
</html>
